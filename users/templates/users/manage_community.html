{% extends 'movies/base.html' %}

{% block title %}Управление проектами - {{ community.name }}{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <h1>Управление проектами</h1>
    <p class="auth-extra" style="margin-bottom: 1rem;">
      Добавляйте фильмы, сериалы и шоу в свою организацию
    </p>

    <form method="post">
      {% csrf_token %}

      <div class="form-group">
        <label for="project_type">Тип проекта</label>
        <select name="project_type" id="project_type" required>
          <option value="">Выберите тип...</option>
          <option value="movie">Фильм</option>
          <option value="series">Сериал</option>
          <option value="show">Шоу</option>
        </select>
      </div>

      <div class="form-group">
        <label for="project_id">Проект</label>
        <select name="project_id" id="project_id" required>
          <option value="">Выберите проект...</option>
          {% for movie in movies %}
            <option value="{{ movie.id }}" {% if movie.id in existing_projects.movies %}disabled{% endif %}>
              {{ movie.title }} (фильм)
            </option>
          {% endfor %}
          {% for series in series %}
            <option value="{{ series.id }}" {% if series.id in existing_projects.series %}disabled{% endif %}>
              {{ series.title }} (сериал)
            </option>
          {% endfor %}
          {% for show in shows %}
            <option value="{{ show.id }}" {% if show.id in existing_projects.shows %}disabled{% endif %}>
              {{ show.title }} (шоу)
            </option>
          {% endfor %}
        </select>
      </div>

      <button type="submit" class="btn auth-btn">Добавить проект</button>
    </form>

    <p class="auth-extra">
      <a href="{% url 'movies:community_detail' community.id %}">← Вернуться к организации</a>
    </p>
  </div>
</div>
{% endblock %}
