{% extends 'movies/base.html' %}

{% block title %}Аккаунт - RV КИНО{% endblock %}

{% block content %}
<div class="profile-wrapper">
  <div class="profile-card account-card">
    <div class="account-avatar">
      <div class="account-avatar-circle{% if user.profile.avatar %} has-avatar{% endif %}">
        {% if user.profile.avatar %}
          <img src="{{ user.profile.avatar.url }}" alt="{{ user.username }}" class="account-avatar-img">
        {% endif %}
      </div>
    </div>

    <div class="account-fields">
      <input
        class="account-input"
        type="text"
        value="{{ user.get_full_name|default:user.username }}"
        placeholder="Имя Фамилия"
        readonly
      >
      <input
        class="account-input"
        type="email"
        value="{{ user.email }}"
        placeholder="Почта"
        readonly
      >
    </div>

    <div class="account-actions">
      <a class="account-btn" href="{% url 'users:profile_edit' %}">Редактировать</a>
      <a class="account-btn" href="{% url 'users:favorites' %}">Избранные</a>
    </div>

    <form method="post" class="profile-consent-form account-consent">
      {% csrf_token %}
      <label class="checkbox-row account-checkbox">
        <input type="checkbox" name="accepted_privacy"
               {% if accepted_privacy %}checked{% endif %}>
        <span>Я принимаю <span class="nbsp"> </span>
          <a href="{% url 'users:privacy' %}" target="_blank" class="legal-link">
            политику конфиденциальности
          </a>
        </span>
      </label>

      <label class="checkbox-row account-checkbox">
        <input type="checkbox" name="accepted_terms"
               {% if accepted_terms %}checked{% endif %}>
        <span>Я принимаю <span class="nbsp"> </span>
          <a href="{% url 'users:terms' %}" target="_blank" class="legal-link">
            пользовательское соглашение
          </a>
        </span>
      </label>

      <button type="submit" class="btn auth-btn">Сохранить</button>
    </form>

    {% if accepted_at %}
      <p class="profile-consent-info">
        Согласия приняты: {{ accepted_at }}
      </p>
    {% endif %}
  </div>
</div>
{% endblock %}
