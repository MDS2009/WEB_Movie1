{% extends 'movies/base.html' %}
{% block title %}{{ news_item.title }} - RV КИНО{% endblock %}
{% block content %}
<section class="page-header">
    <div class="container">
        <h1>{{ news_item.title }}</h1>
        <p class="news-date">{{ news_item.published_at|date:"d.m.Y" }}</p>
    </div>
</section>
<section class="about-section">
    <div class="container">
        <div class="news-article">
            {% if news_item.image %}
                <img src="{{ news_item.image.url }}" alt="{{ news_item.title }}" class="news-article-image">
            {% endif %}
            <div class="about-content news-article-content">
                {{ news_item.content|linebreaks }}
            </div>
            <a href="{% url 'movies:news_list' %}" class="btn">← Все новости</a>
        </div>
    </div>
</section>
{% endblock %}
