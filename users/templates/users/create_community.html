{% extends 'movies/base.html' %}
{% load static %}

{% block title %}Создание сообщества - RV КИНО{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <img src="{% static 'movies/images/logo_RV.png' %}" alt="RV КИНО" class="auth-logo">
      <h2>Создание организации</h2>
      <p>Создайте свою организацию для совместной работы над проектами</p>
    </div>

    <form method="post" enctype="multipart/form-data" class="auth-form">
      {% csrf_token %}
      
      <div class="form-group">
        <label for="id_name">Название организации *</label>
        <input type="text" name="name" id="id_name" class="form-control" required>
      </div>

      <div class="form-group">
        <label for="id_description">Описание</label>
        <textarea name="description" id="id_description" class="form-control" rows="4"></textarea>
      </div>

      <div class="form-group">
        <label for="id_members">Участники</label>
        <textarea name="members" id="id_members" class="form-control" rows="3" placeholder="Иван Петров (режиссер), Мария Сидорова (продюсер)"></textarea>
      </div>

      <div class="form-group">
        <label for="id_contact_info">Контактная информация</label>
        <input type="text" name="contact_info" id="id_contact_info" class="form-control" placeholder="Телефон: +7 (999) 123-45-67, Email: info@example.com">
      </div>

      <div class="form-group">
        <label for="id_avatar">Логотип организации</label>
        <input type="file" name="avatar" id="id_avatar" class="form-control" accept="image/*">
      </div>

      <button type="submit" class="auth-btn">Создать организацию</button>
    </form>

    <div class="auth-footer">
      <a href="{% url 'users:profile' %}" class="auth-link">← Вернуться в профиль</a>
    </div>
  </div>
</div>

<style>
.auth-wrapper {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
}

.auth-card {
  background: #2a2a2a;
  border-radius: 15px;
  padding: 2.5rem;
  width: 100%;
  max-width: 500px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
  border: 1px solid #333;
}

.auth-header {
  text-align: center;
  margin-bottom: 2rem;
}

.auth-logo {
  width: 80px;
  height: auto;
  margin-bottom: 1rem;
}

.auth-header h2 {
  color: #fff;
  margin: 0 0 0.5rem 0;
  font-size: 1.8rem;
}

.auth-header p {
  color: #ccc;
  margin: 0;
  font-size: 0.9rem;
}

.auth-form {
  margin-bottom: 1.5rem;
}

.form-group {
  margin-bottom: 1.5rem;
}

.form-group label {
  display: block;
  color: #fff;
  margin-bottom: 0.5rem;
  font-weight: 500;
}

.form-control {
  width: 100%;
  padding: 0.75rem;
  background: #1a1a1a;
  border: 1px solid #444;
  border-radius: 8px;
  color: #fff;
  font-size: 1rem;
  transition: border-color 0.3s ease;
}

.form-control:focus {
  outline: none;
  border-color: #ff6b6b;
  box-shadow: 0 0 0 2px rgba(255, 107, 107, 0.2);
}

.auth-btn {
  width: 100%;
  padding: 0.875rem;
  background: linear-gradient(135deg, #ff6b6b 0%, #ff5252 100%);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
}

.auth-btn:hover {
  background: linear-gradient(135deg, #ff5252 0%, #ff3838 100%);
  transform: translateY(-2px);
  box-shadow: 0 5px 15px rgba(255, 107, 107, 0.3);
}

.auth-footer {
  text-align: center;
}

.auth-link {
  color: #ff6b6b;
  text-decoration: none;
  font-size: 0.9rem;
  transition: color 0.3s ease;
}

.auth-link:hover {
  color: #ff5252;
}

@media (max-width: 768px) {
  .auth-wrapper {
    padding: 1rem;
  }
  
  .auth-card {
    padding: 2rem;
  }
}
</style>
{% endblock %}
